# HarmonyOS (OHOS) 交叉编译配置
#
# rustc 的 ohos target 默认链接器不满足 NDK 布局，这里显式指向
# OHOS NDK 自带 clang，并通过 --target / --sysroot 让 clang 找到
# OHOS 的 CRT 目标文件与系统库。
#
# 如本机 NDK 路径不同，可用 HARMONY_NATIVE_SDK 环境变量覆盖 build.rs 行为；
# 本文件中的绝对路径需按本机 DevEco Studio 安装位置调整。

[target.aarch64-unknown-linux-ohos]
linker = "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/clang"
rustflags = [
    "-C",
    "link-args=--target=aarch64-unknown-linux-ohos --sysroot=/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/sysroot",
]

[target.x86_64-unknown-linux-ohos]
linker = "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/clang"
rustflags = [
    "-C",
    "link-args=--target=x86_64-unknown-linux-ohos --sysroot=/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/sysroot",
]
